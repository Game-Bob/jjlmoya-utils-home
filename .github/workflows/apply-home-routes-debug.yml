name: Apply home routes diagnostic

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    apply:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - name: Apply routes and print Cloudflare response
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -euo pipefail
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs';
                  const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
                  fs.writeFileSync('/tmp/home-routes.json', JSON.stringify(config.routes));
                  NODE
                  curl --silent --show-error --max-time 30 \
                    -o /tmp/home-routes-response.json \
                    -w 'routes_http=%{http_code}\n' \
                    -X PUT \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    -H 'Content-Type: application/json' \
                    --data-binary @/tmp/home-routes.json \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gamebob-utilities-home/routes"
                  sed -E 's/([A-Fa-f0-9]{20,})/[redacted]/g' /tmp/home-routes-response.json
