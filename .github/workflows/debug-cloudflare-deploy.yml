name: Debug Cloudflare deployment

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.18.0"
                  cache: "npm"
            - run: npm ci
            - run: npm run build
              env:
                  PUBLIC_APP_VERSION: debug
            - name: Deploy with Wrangler debug logs
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  WRANGLER_LOG: debug
                  WRANGLER_LOG_SANITIZE: false
              run: ./node_modules/.bin/wrangler deploy
            - name: Capture direct route API response
              if: always()
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  node --input-type=module <<'NODE'
                  const fs = require('node:fs');
                  const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
                  const routes = config.routes.map((route) => typeof route === 'string' ? { pattern: route } : route);
                  const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${config.name}/routes`, {
                    method: 'PUT',
                    headers: {
                      Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(routes),
                  });
                  console.log(`HTTP ${response.status}`);
                  console.log(await response.text());
                  NODE
