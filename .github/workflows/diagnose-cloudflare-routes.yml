name: Diagnose Cloudflare routes

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    inspect:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Inspect route ownership
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -euo pipefail
                  for zone in jjlmoya.es gamebob.dev; do
                      zone_id=$(curl -fsS \
                          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                          -H "Content-Type: application/json" \
                          "https://api.cloudflare.com/client/v4/zones?name=$zone&status=active" \
                          | jq -r '.result[0].id')
                      echo "--- $zone ($zone_id) ---"
                      curl -fsS \
                          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                          -H "Content-Type: application/json" \
                          "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes?per_page=1000" \
                          | jq -r '.result[] | [.id, .pattern, (.script // "<none>")] | @tsv'
                  done
