name: Verify Cloudflare credentials

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Verify token and account
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -euo pipefail
                  test -n "$CLOUDFLARE_API_TOKEN"
                  test -n "$CLOUDFLARE_ACCOUNT_ID"
                  curl --fail-with-body --silent --show-error --max-time 20 \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    https://api.cloudflare.com/client/v4/user/tokens/verify
                  curl --fail-with-body --silent --show-error --max-time 20 \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
                  printf '%s' '[]' > /tmp/home-routes.json
                  curl --silent --show-error --max-time 20 \
                    -o /tmp/home-routes-response.json \
                    -w 'routes_http=%{http_code}\n' \
                    -X PUT \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    -H 'Content-Type: application/json' \
                    --data-binary @/tmp/home-routes.json \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gamebob-utilities-home/routes"
                  sed -E 's/([A-Fa-f0-9]{20,})/[redacted]/g' /tmp/home-routes-response.json
