name: Verify Cloudflare credentials

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Check Cloudflare token and account
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -u
                  check_endpoint() {
                    local label="$1"
                    local url="$2"
                    local response_file="/tmp/cloudflare-${label}.json"
                    local status
                    status=$(curl --silent --show-error --max-time 20 \
                      -o "$response_file" -w '%{http_code}' \
                      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                      "$url")
                    echo "${label}_http=${status}"
                    sed -E 's/([A-Fa-f0-9]{20,})/[redacted]/g' "$response_file"
                  }
                  test -n "$CLOUDFLARE_API_TOKEN"
                  test -n "$CLOUDFLARE_ACCOUNT_ID"
                  check_endpoint token "https://api.cloudflare.com/client/v4/user/tokens/verify"
                  check_endpoint account "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
                  check_endpoint worker "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gamebob-utilities-home/routes"
                  printf '%s' '[]' > /tmp/home-routes.json
                  curl --silent --show-error --max-time 20 \
                    -o /tmp/cloudflare-route-write.json \
                    -w 'route_write_http=%{http_code}\n' \
                    -X PUT \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    -H 'Content-Type: application/json' \
                    --data-binary @/tmp/home-routes.json \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gamebob-utilities-home/routes"
                  sed -E 's/([A-Fa-f0-9]{20,})/[redacted]/g' /tmp/cloudflare-route-write.json
